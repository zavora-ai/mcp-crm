server_id = "mcp_crm"
display_name = "CRM"
version = "1.0.0"
domain = "business-systems"
sdk_version = "0.1.0"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = ["vault://salesforce-oauth", "vault://hubspot-token", "vault://zoho-crm-token", "vault://pipedrive-token"]
governance_gates = ["crm-write-policy"]
environments = ["development", "staging", "production"]

# ─── Contacts ─────────────────────────────────────────────────────────────────

[[tools]]
name = "list_contacts"
description = "List contacts with optional search query"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://salesforce-oauth", "vault://hubspot-token", "vault://zoho-crm-token", "vault://pipedrive-token"]

[[tools]]
name = "get_contact"
description = "Get a contact by ID"
risk_class = "read_only"
