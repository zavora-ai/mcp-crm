risk_class = "internal_write"
requires_approval = false
credential_bindings = ["vault://salesforce-oauth", "vault://hubspot-token", "vault://zoho-crm-token", "vault://pipedrive-token"]

[[tools]]
name = "update_contact"
description = "Update an existing contact"
